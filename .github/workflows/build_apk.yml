name: 'Build Kiwi Browser APK (Chromium 160 Dev ARM64)'

on:
  pull_request:
    branches:
      - kiwi
      - feat/chromium-upgrade-mcp
  workflow_dispatch:
    inputs:
      chromium_workspace:
        description: 'Path on self-hosted x86_64 runner for Chromium checkout'
        required: false
        default: '/opt/chromium'

concurrency: build_test_apk

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1440

    steps:
      - name: Checkout Kiwi overlay
        uses: actions/checkout@v4

      - name: Read target Chromium version
        id: version
        run: |
          source CHROMIUM_VERSION
          TAG="${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Chromium tag: ${TAG}"

      - name: Ensure depot_tools and host dependencies are available
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl rsync python3 build-essential pkg-config libglib2.0-dev libnss3 libxcb1 libx11-6 libxext6 libxi6 libxrender1 libxtst6
          if [ ! -d "$HOME/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Sync Chromium at target tag
        env:
          CHROMIUM_ROOT: ${{ inputs.chromium_workspace || '/opt/chromium' }}
          TARGET_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p "$CHROMIUM_ROOT"
          cd "$CHROMIUM_ROOT"
          if [ ! -d src/.git ]; then
            fetch --nohooks android
          fi
          cd src
          git reset --hard
          git clean -fd
          git fetch origin "refs/tags/${TARGET_TAG}:refs/tags/${TARGET_TAG}"
          git checkout -f "tags/${TARGET_TAG}"
          gclient sync -D --with_branch_heads --with_tags

      - name: Overlay Kiwi MCP Bridge & GN config
        env:
          CHROMIUM_ROOT: ${{ inputs.chromium_workspace || '/opt/chromium' }}
        run: |
          python3 scripts/audit_chromium_overlay.py --json
          mkdir -p "${CHROMIUM_ROOT}/src/extensions/kiwi_mcp_bridge"
          cp -r extensions/kiwi_mcp_bridge/* "${CHROMIUM_ROOT}/src/extensions/kiwi_mcp_bridge/"
          mkdir -p "${CHROMIUM_ROOT}/src/out/KiwiArm64"
          cp .build/chromium_159/args.gn "${CHROMIUM_ROOT}/src/out/KiwiArm64/args.gn"

      - name: Configure and build chrome_public_apk
        env:
          CHROMIUM_ROOT: ${{ inputs.chromium_workspace || '/opt/chromium' }}
        run: |
          cd "${CHROMIUM_ROOT}/src"
          if ! gn gen out/KiwiArm64; then
            echo "Fallback: removing enable_desktop_android_extensions if unsupported on this target..."
            sed -i '/enable_desktop_android_extensions/d' out/KiwiArm64/args.gn
            gn gen out/KiwiArm64
          fi
          autoninja -C out/KiwiArm64 chrome_public_apk
          cp out/KiwiArm64/apks/ChromePublic.apk "${GITHUB_WORKSPACE}/kiwi-arm64.apk"

      - name: Upload Kiwi ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-arm64-${{ steps.version.outputs.tag }}
          path: kiwi-arm64.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: Kiwi Next v${{ steps.version.outputs.tag }}
          body: |
            ### 🥝 Kiwi Browser Next — Modernized Chromium 160 & MCP Edition
            
            - **Core Engine:** Upgraded to Chromium 160 Dev (`${{ steps.version.outputs.tag }}`)
            - **Manifest V3 Desktop Extensions:** Native support on Android
            - **Model Context Protocol (MCP):** Built-in `kiwi_mcp_bridge` for AI agents (ws://127.0.0.1:9223)
            - **Architecture:** ARM64 (`aarch64`)
            
            Install on your phone directly or using Shizuku:
            ```bash
            bash scripts/deploy_shizuku.sh kiwi-arm64.apk
            ```
          files: kiwi-arm64.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
